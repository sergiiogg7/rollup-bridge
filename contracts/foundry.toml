[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# The tree-vector script writes testdata/tree-vectors.json (consumed by the Java differential tests).
fs_permissions = [{ access = "read-write", path = "../testdata" }, { access = "read-write", path = "../deployments" }]

[fuzz]
runs = 256
seed = "0x1"

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 512, depth = 256 }
verbosity = 3
