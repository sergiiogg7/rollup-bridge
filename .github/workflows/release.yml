name: Release

# Runs only when a tag like v0.1.0 is pushed. It builds the shaded jar (tests are the job of CI, which already ran on the
# commit being tagged) and attaches it to the GitHub release of that tag, creating the release if it does not exist.
permissions: {}

on:
  push:
    tags:
      - "v*"

jobs:
  jar:
    name: Build and attach the jar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build the shaded jar
        run: ./mvnw -B -T 1 -DskipTests package

      - name: Name the artifact after the tag and checksum it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp services/app/target/rollup-bridge.jar "dist/rollup-bridge-${TAG}.jar"
          (cd dist && sha256sum "rollup-bridge-${TAG}.jar" > "rollup-bridge-${TAG}.jar.sha256")
          ls -l dist

      - name: Create the release if needed and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
